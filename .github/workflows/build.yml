name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  firmware:
    name: SP-1 firmware (sp1master.bin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sp-1master
      - name: Cache the Zephyr SDK and tree
        id: zcache
        uses: actions/cache@v4
        with:
          path: |
            ~/zephyr-sdk-0.17.4
            ws
          key: zephyr-4.3.1-sdk-0.17.4-nordic
      - name: Zephyr SDK 0.17.4 (arm only)
        if: steps.zcache.outputs.cache-hit != 'true'
        run: |
          cd $HOME
          curl -sSL -o sdk.tar.xz https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/zephyr-sdk-0.17.4_linux-x86_64_minimal.tar.xz
          tar xf sdk.tar.xz && rm sdk.tar.xz
          curl -sSL -o arm.tar.xz https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz
          tar xf arm.tar.xz -C zephyr-sdk-0.17.4 && rm arm.tar.xz
      - name: Zephyr v4.3.1 (hal_nordic, cmsis)
        if: steps.zcache.outputs.cache-hit != 'true'
        run: |
          pip install west
          git clone --depth 1 --branch v4.3.1 https://github.com/zephyrproject-rtos/zephyr ws/zephyr
          cd ws && west init -l zephyr
          west config manifest.project-filter -- '-.*,+hal_nordic,+cmsis_6,+cmsis'
          west update --narrow -o=--depth=1
      - name: Build
        run: |
          pip install west -r ws/zephyr/scripts/requirements-base.txt
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.4 ZEPHYR_BASE=$GITHUB_WORKSPACE/ws/zephyr
          cd ws && ../sp-1master/scripts/build-firmware.sh
      - name: Check the binary
        run: |
          # flashable by the SP-1 bootloader: loaded at 0x20000, at most 0xDF000 bytes, the vector
          # table first (initial stack in RAM, reset handler inside the image)
          python3 - sp-1master/sp1master.bin <<'PY'
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          sp, reset = struct.unpack("<II", b[:8])
          print(f"size {len(b)}, initial SP {sp:#x}, reset {reset:#x}")
          assert 0 < len(b) <= 0xDF000, "too big for the application slot"
          assert 0x20000000 < sp <= 0x20040000, "initial stack pointer is not in RAM"
          assert reset & 1 and 0x20000 <= (reset & ~1) < 0x20000 + len(b), "reset handler outside the image"
          PY
          # and it fits: RAM used, from the build
          grep -q "CONFIG_BOARD_STEM_PLAYER=y" sp-1master/build/firmware/zephyr/.config
      - name: CPU estimate (Cortex-M4 at 48 kHz, the heaviest chain, every fader full)
        run: |
          pip install unicorn capstone
          ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.4 python3 sp-1master/tools/bench_m4.py -v | tee bench.txt
          # one core is 100%; the estimate leaves out USB, cache misses and stalls, so keep it low
          pct=$(sed -n 's/.*: \([0-9]*\)% of one core.*/\1/p' bench.txt)
          echo "worst case: $pct% of one core"
          test -n "$pct" && test "$pct" -le 55
      - uses: actions/upload-artifact@v4
        with:
          name: sp1master-firmware
          path: sp-1master/sp1master.bin

  test:
    name: Mastering engine tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the checks
        run: |
          mkdir -p build/test
          make test | tee build/test/results.txt
      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "^PASS: 0 failed" $r
          # the sound's promises
          for c in london punch clean lacquer; do
            grep -q "^$c rest: bit-exact input at the stated latency .* ok" $r
            grep -q "^$c: blocks of 256 and of 1..300: same output .* ok" $r
            grep -q "^$c full, +1.6 dBFS in: peak under the -1 dBFS ceiling .* ok" $r
            grep -q "^$c sweep all faders: no clicks .* ok" $r
          done
          grep -q "^switch: chains and bypass, no clicks .* ok" $r
          grep -q "^bypass: bit-exact input at the stated latency .* ok" $r
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  manual:
    name: User manual (PDF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, for the version on the cover
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc fonts-inter >/dev/null
      - name: Build the PDF
        env:
          VERSION: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          [ -n "$VERSION" ] || unset VERSION
          CHROME=$(command -v google-chrome) ./scripts/build-manual.sh
      - name: Remind to update the manual
        if: github.event_name == 'pull_request'
        run: |
          # firmware or engine changed but the manual didn't: a nudge, not a failure
          changed=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if echo "$changed" | grep -qE '^(firmware/src|master)/' && ! echo "$changed" | grep -q '^docs/manual/'; then
            echo "::warning title=Manual not updated::firmware/ or master/ changed but docs/manual/manual.md did not. If anything a player sees or hears changed, update the manual."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: manual
          path: build/manual/SP-1-Master-manual.pdf

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [firmware, test, manual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sp1master-firmware
      - uses: actions/download-artifact@v4
        with:
          name: manual
      - name: Create GitHub release with sp1master.bin and the manual
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" sp1master.bin SP-1-Master-manual.pdf --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" sp1master.bin SP-1-Master-manual.pdf \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SP-1 Master $TAG (test build)" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
